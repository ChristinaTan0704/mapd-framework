# TA-Hybrid (offline LKH3 task sequences, reassigned as agents become free), Table 1
# Every component is set explicitly; run with
#   ./mapd -m <map> -t <task> --config configs/table1/TA-Hybrid.cfg
# Command-line options override these lines.

# 1. When to call task assignment: when a task is released or deferred, or an agent becomes free
assign_trigger = ON_NEW_OR_DEFERRED_TASK_OR_AGENT_BECOMES_FREE

# 2. Task assignment algorithm: LKH3 mTSP task sequences with reassignment
assign_method = LKH3_TSP_REASSIGN

# 3. When to plan paths: after every task assignment and whenever a carrier reaches a goal
replan_on = AFTER_ASSIGNMENT,GOAL_REACHED

# 4. Which agents to plan: agents whose tasks changed (the others keep their paths)
agent_selection = CHANGED

# 5. High-level planner: two groups: CBS for carrying agents, prioritized planning for the others
mapf = TA_HYBRID_TWO_GROUP

# 6. Low-level planner: space-time A* (STA*)
single_agent = STA

# 7. Task endpoint: fixed parking: return to the agent's home endpoint
endpoint_strategy = RETURN_TO_HOME
dummy_path = 1

# 8. Task setup: offline (every task is known at time 0)
mode = OFFLINE

# 9. Task type: MAPD (pickup and delivery); use MG_MAPD for multi-goal tasks
task_type = MAPD
