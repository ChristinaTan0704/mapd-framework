# CENTRAL-fixed, Table 1: CENTRAL with Extensions 2 and 4 of Ma's thesis
# (Sec 6.5.3): assignment when a task is added or an agent becomes free, and a
# match is kept until its task is picked up ("less effective but more
# efficient"). The original results in the Excel are those of the reference
# CENTRAL code, so this configuration is expected to be worse than them.
# Every component is set explicitly; run with
#   ./mapd -m <map> -t <task> --config configs/table1/CENTRAL-fixed.cfg
# Command-line options override these lines.

# 1. When to call task assignment: a task is released (or its pickup is
#    deferred because its delivery is held), or an agent becomes free
assign_trigger = ON_NEW_OR_DEFERRED_TASK_OR_AGENT_BECOMES_FREE

# 2. Task assignment algorithm: Hungarian matching of the agents without a
#    task to unmatched pickups or parking endpoints; matches persist
assign_method = CENTRAL_HUNGARIAN_FIXED

# 3. When to plan paths: after each assignment (agents that picked up a task
#    are planned first, inside the assignment: two-stage planning)
replan_on = AFTER_ASSIGNMENT,GOAL_REACHED

# 4. Which agents to plan: agents whose tasks changed and every agent that
#    carries no task (carriers keep their paths)
agent_selection = CHANGED_OR_NOT_CARRYING

# 5. High-level planner: CBS, one segment to each agent's next goal; plain
#    ECBS with focal weight 1 as in the reference code (earliest conflict, no
#    ICBS improvements), which then runs that code's ECBS
mapf = CBS
ecbs_focal_weight = 1.0
cbs_conflict_selection = earliest
cbs_bypass = 0
cbs_target_reasoning = 0
cbs_rectangle_reasoning = 0
# The reference ECBS has no expansion limit; this one keeps every kiva-small
# run within 1000 s (a search that reaches it falls back as any CBS does)
cbs_high_level_expansion_limit = 1000000

# 6. Low-level planner: multi-label A* (MLA*); CENTRAL plans one goal per agent at a time
single_agent = MLA

# 7. Task endpoint: task endpoint; idle agents are matched to the nearest available endpoint
endpoint_strategy = NEAREST_AVAILABLE
dummy_path = 0

# 8. Task setup: online (tasks are revealed at their release times)
mode = ONLINE

# 9. Task type: MAPD (pickup and delivery); use MG_MAPD for multi-goal tasks
task_type = MAPD
