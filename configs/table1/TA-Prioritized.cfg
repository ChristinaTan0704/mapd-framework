# TA-Prioritized (offline LKH3 task sequences, prioritized planning), Table 1
# Every component is set explicitly; run with
#   ./mapd -m <map> -t <task> --config configs/table1/TA-Prioritized.cfg
# Command-line options override these lines.

# 1. When to call task assignment: once, at time 0
assign_trigger = ONCE

# 2. Task assignment algorithm: LKH3 mTSP task sequences
assign_method = LKH3_TSP

# 3. When to plan paths: after the task assignment
replan_on = AFTER_ASSIGNMENT

# 4. Which agents to plan: all agents
agent_selection = ALL

# 5. High-level planner: prioritized planning of each agent's whole task sequence
mapf = PP_TASK_SEQUENCE

# 6. Low-level planner: sequential space-time A* over the task sequence
single_agent = SEQ_STA

# 7. Task endpoint: fixed parking: return to the agent's home endpoint
endpoint_strategy = RETURN_TO_HOME
dummy_path = 1

# 8. Task setup: offline (every task is known at time 0)
mode = OFFLINE

# 9. Task type: MAPD (pickup and delivery); use MG_MAPD for multi-goal tasks
task_type = MAPD
