# LNS-wPBS, Table 1
# Every component is set explicitly; run with
#   ./mapd -m <map> -t <task> --config configs/table1/LNS-wPBS.cfg
# Command-line options override these lines.

# 1. When to call task assignment: when a task is released or deferred, or an agent becomes free
assign_trigger = ON_NEW_OR_DEFERRED_TASK_OR_AGENT_BECOMES_FREE

# 2. Task assignment algorithm: repeated Hungarian matching improved by LNS (1 s per call)
assign_method = REPEATED_HUNGARIAN_LNS
lns_time = 1

# 3. When to plan paths: after every task assignment and every w steps
replan_on = AFTER_ASSIGNMENT,PERIODIC

# 4. Which agents to plan: all agents
agent_selection = ALL

# 5. High-level planner: windowed PBS (wPBS)
mapf = wPBS
task_sequence_limit = 2

# 5.1 wPBS window: replan every w executed steps, resolving conflicts within w steps
wpbs_replan_window = 10

# 6. Low-level planner: multi-label A* (MLA*) over each agent's goal sequence
single_agent = MLA

# 7. Task endpoint: flexible: pairwise-distinct task endpoints first, then parking endpoints
endpoint_strategy = PAIRWISE_TASK_THEN_HOME
dummy_path = 1

# 8. Task setup: online (tasks are revealed at their release times)
mode = ONLINE

# 9. Task type: MAPD (pickup and delivery); use MG_MAPD for multi-goal tasks
task_type = MAPD
