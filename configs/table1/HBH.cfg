# HBH-MLA* (centralized greedy assignment), Table 1
# Every component is set explicitly; run with
#   ./mapd -m <map> -t <task> --config configs/table1/HBH.cfg
# Command-line options override these lines.

# 1. When to call task assignment: when any free agent terminally waits
assign_trigger = ON_FREE_WAITS

# 2. Task assignment algorithm: centralized greedy: globally nearest (agent, task) pairs first
assign_method = CENTRALIZED_GREEDY

# 3. When to plan paths: when an agent is assigned a task, inside the assignment
replan_on = WHEN_ASSIGNED

# 4. Which agents to plan: agents whose tasks changed (the others keep their paths)
agent_selection = CHANGED

# 5. High-level planner: prioritized planning, one task at a time against the committed paths
mapf = PP

# 6. Low-level planner: multi-label A* (MLA*) over each agent's goal sequence
single_agent = MLA

# 7. Task endpoint: hold the task endpoint; move to the nearest free parking endpoint when it is needed
endpoint_strategy = WAIT_OR_NEAREST_FREE_NONTASK
dummy_path = 1

# 8. Task setup: online (tasks are revealed at their release times)
mode = ONLINE

# 9. Task type: MAPD (pickup and delivery); use MG_MAPD for multi-goal tasks
task_type = MAPD
