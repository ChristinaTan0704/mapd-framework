# Repeated Hungarian + LNS judged on real paths, windowed PBS (wPBS) with MLSIPP, strict endpoints
# LNS-real-wPBS-MLSIPP with the endpoint of the PP and PBS versions (component 7); everything else is the same.
# Every component is set explicitly; run with
#   ./mapd -m <map> -t <task> --config configs/variants/LNS-real-wPBS-MLSIPP-strict.cfg
# Command-line options override these lines.

# 1. When to call task assignment: when a task is released or deferred, or an agent becomes free
assign_trigger = ON_NEW_OR_DEFERRED_TASK_OR_AGENT_BECOMES_FREE

# 2. Task assignment algorithm: repeated Hungarian matching improved by LNS; every LNS candidate is
#    planned with the planner below and kept only if its real paths are cheaper. Each call also starts
#    from the previous call's best sequences; a move removes 4 random queued tasks, one of them an
#    agent's next task, and reinserts them by regret. A call stops after 300 rejected moves, 50 planned
#    candidates in a row that were not cheaper, or 10 CPU seconds (as tuned for LNS-real-PP-MLSIPP).
assign_method = REPEATED_HUNGARIAN_REAL_PATH_LNS
lns_time = 10
lns_no_improvement_limit = 300
real_lns_patience = 50
real_lns_warm_start = 1
real_lns_destroy_planned = 1
real_lns_destroy_size = 4

# 3. When to plan paths: after every task assignment (the assignment already planned the paths it
#    chose, so this planning step is skipped) and every w steps (wPBS's periodic replans, as usual)
replan_on = AFTER_ASSIGNMENT,PERIODIC

# 4. Which agents to plan: all agents
agent_selection = ALL

# 5. High-level planner: windowed PBS (wPBS); it also plans every LNS candidate
mapf = wPBS
task_sequence_limit = 1

# 5.1 wPBS window: replan every w executed steps, resolving conflicts within w steps
wpbs_replan_window = 10

# 6. Low-level planner: multi-label SIPP (MLSIPP) over each agent's goal sequence
single_agent = MLSIPP

# 7. Task endpoint: flexible: nearest endpoint not needed by another task or agent (strict exclusions),
#    as LNS-real-PP-MLSIPP and LNS-real-PBS-MLSIPP. With wPBS, PAIRWISE_TASK_THEN_HOME does not skip
#    the goals of open tasks or other agents, so an idle agent may park where a task is about to start;
#    this one does (on the six small maps, seeds 0-4: SWT 0.9% lower, 2.4% at task frequencies 0.2 and 0.5).
endpoint_strategy = NEAREST_WITH_STRICT_EXCLUSIONS
dummy_path = 1

# 8. Task setup: online (tasks are revealed at their release times)
mode = ONLINE

# 9. Task type: MAPD (pickup and delivery); use MG_MAPD for multi-goal tasks
task_type = MAPD
